# Pushing a tag such as v1.0.0 tests the editor, builds the installer and publishes it as a release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python test_uch_level.py
      - run: python test_editor.py
      - run: pyinstaller --noconfirm --windowed --name "UCH Level Maker" --icon icon.ico editor.py
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$v" installer.iss
          if ($LASTEXITCODE) { exit 1 }
      - name: Install it like a user would and start it from the desktop icon
        shell: pwsh
        run: |
          Start-Process dist\UCH-Level-Maker-Setup.exe "/VERYSILENT /SUPPRESSMSGBOXES" -Wait
          $link = Join-Path ([Environment]::GetFolderPath("Desktop")) "UCH Level Maker.lnk"
          if (-not (Test-Path $link)) { throw "no desktop icon" }
          $exe = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          $p = Start-Process $exe -PassThru
          Add-Type -Namespace W -Name U -MemberDefinition '
            public delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(Cb c, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            public static string Titles(uint pid) { var r = ""; EnumWindows((h, l) => { uint q; GetWindowThreadProcessId(h, out q);
              if (q == pid) { var b = new System.Text.StringBuilder(200); GetWindowText(h, b, 200); r += "[" + b + "]"; } return true; }, IntPtr.Zero); return r; }'
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 1; $t = [W.U]::Titles($p.Id); if ($t -like "*UCH level maker*") { break } }
          if ($p.HasExited) { throw "the app closed with code $($p.ExitCode)" }
          if ($t -notlike "*UCH level maker*") { throw "no editor window after ${i} s, windows: $t" }
          "installed at $exe, window after ${i} s: $t"
          $p.Kill()
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/UCH-Level-Maker-Setup.exe --title "UCH Level Maker ${{ github.ref_name }}" --notes "Download UCH-Level-Maker-Setup.exe, run it and start the editor from the desktop icon."
